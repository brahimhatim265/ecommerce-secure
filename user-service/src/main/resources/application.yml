server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:h2:mem:usersdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:9000}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  seed:
    # DEMONSTRATION ONLY: shared password of the seeded accounts. Never use it outside a demo.
    default-password: ${SEED_DEFAULT_PASSWORD:Demo@2026}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
