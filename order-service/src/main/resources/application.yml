server:
  port: 8082
  ssl:
    bundle: mtls
    client-auth: want

spring:
  application:
    name: order-service
  ssl:
    bundle:
      jks:
        mtls:
          key:
            alias: order-service
          keystore:
            location: ${ORDER_SERVICE_KEYSTORE_LOCATION:classpath:certs/keystore.p12}
            password: ${PKI_PASSWORD:ecommerce-demo-pki}
            type: PKCS12
          truststore:
            location: ${PKI_TRUSTSTORE_LOCATION:classpath:certs/truststore.p12}
            password: ${PKI_PASSWORD:ecommerce-demo-pki}
            type: PKCS12
          options:
            enabled-protocols: TLSv1.3,TLSv1.2
  datasource:
    url: jdbc:h2:mem:ordersdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:https://localhost:9000}

management:
  endpoints:
    web:
      exposure:
        include: health

services:
  user:
    base-url: ${USER_SERVICE_URL:https://localhost:8081}
  payment:
    base-url: ${PAYMENT_SERVICE_URL:https://localhost:8083}
  http:
    connect-timeout: ${HTTP_CONNECT_TIMEOUT:2s}
    read-timeout: ${HTTP_READ_TIMEOUT:5s}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
