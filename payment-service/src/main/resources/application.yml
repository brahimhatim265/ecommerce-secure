server:
  port: 8083
  ssl:
    # HTTPS only: there is no HTTP connector. The client certificate is requested but NOT required ("want"),
    # so public and JWT-authenticated endpoints stay reachable without one. Never use "need".
    # Whatever certificate IS presented must be signed by the project CA, otherwise the handshake fails.
    bundle: mtls
    client-auth: want

spring:
  application:
    name: payment-service
  # TLS material (step 7): one bundle named "mtls", used by the HTTPS server.
  # DEMONSTRATION ONLY: the default password below is public. Override it with PKI_PASSWORD.
  # Paths default to the classpath and can be overridden (PAYMENT_SERVICE_KEYSTORE_LOCATION / PKI_TRUSTSTORE_LOCATION,
  # e.g. file:/path/to/keystore.p12).
  ssl:
    bundle:
      jks:
        mtls:
          key:
            alias: payment-service
          keystore:
            location: ${PAYMENT_SERVICE_KEYSTORE_LOCATION:classpath:certs/keystore.p12}
            password: ${PKI_PASSWORD:ecommerce-demo-pki}
            type: PKCS12
          truststore:
            location: ${PKI_TRUSTSTORE_LOCATION:classpath:certs/truststore.p12}
            password: ${PKI_PASSWORD:ecommerce-demo-pki}
            type: PKCS12
          options:
            enabled-protocols: TLSv1.3,TLSv1.2
  datasource:
    url: jdbc:h2:mem:paymentsdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:https://localhost:9000}

management:
  endpoints:
    web:
      exposure:
        include: health

payment:
  simulation:
    random:
      # Optional: when set, tok_random draws are reproducible (same sequence at every startup).
      seed: ${PAYMENT_RANDOM_SEED:}
      # Integers >= 0 with a sum > 0; they are normalized, they do not have to add up to 100.
      weights:
        success: ${PAYMENT_WEIGHT_SUCCESS:60}
        insufficient-funds: ${PAYMENT_WEIGHT_INSUFFICIENT_FUNDS:20}
        card-declined: ${PAYMENT_WEIGHT_CARD_DECLINED:10}
        expired-card: ${PAYMENT_WEIGHT_EXPIRED_CARD:10}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
